name: Verify Pip platforms

on:
  pull_request:
    paths:
      - 'browser-source/**'
      - '.github/workflows/verify-pip-platforms.yml'
  push:
    branches: [main]
    paths:
      - 'browser-source/**'
      - '.github/workflows/verify-pip-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (development)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build development APK
        working-directory: browser-source/android
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pip-Android-development-APK
          path: browser-source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }} (development)
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: browser-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
          targets: ${{ matrix.target }}
      - name: Check macOS source formatting
        run: rustfmt --edition 2021 --check crates/app/src/macos_main.rs
      - name: Test shared core and macOS shell
        run: |
          cargo test -p evergreen-core --locked
          cargo test -p evergreen-browser --bin pip-macos --features macos-shell --locked
      - name: Build macOS shell
        run: cargo build -p evergreen-browser --bin pip-macos --features macos-shell --release --locked --target ${{ matrix.target }}
      - name: Package development app
        run: bash scripts/package-macos.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pip-macOS-${{ matrix.arch }}-development
          path: browser-source/dist/Pip-macOS-*.zip
          if-no-files-found: error
          retention-days: 7
