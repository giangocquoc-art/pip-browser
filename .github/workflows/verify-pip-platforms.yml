name: Verify Pip platforms

on:
  pull_request:
    paths:
      - 'browser-source/**'
      - '.github/workflows/verify-pip-platforms.yml'
  push:
    branches: [main]
    paths:
      - 'browser-source/**'
      - '.github/workflows/verify-pip-platforms.yml'
  workflow_dispatch:
    inputs:
      live_youtube:
        description: Run an opt-in live YouTube smoke probe on the Android emulator
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pip-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (development)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Test real native filter engine and build Android JNI libraries
        working-directory: browser-source/android
        run: |
          rustfmt --edition 2021 --check native/src/lib.rs
          cargo test --manifest-path native/Cargo.toml --locked
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash native/build-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pip-Android-native-libraries
          path: browser-source/android/app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 7
      - name: Test, lint and build development APK
        working-directory: browser-source/android
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Verify native engine packaged for every supported ABI
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('browser-source/android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
                  assert apk.getinfo(f'lib/{abi}/libpip_adblock.so').file_size > 0
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 browser-source/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Show Android lint diagnostics
        if: failure()
        run: |
          find browser-source/android/app/build -name 'lint-results-*.txt' -type f -exec cat {} \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pip-Android-development-APK
          path: browser-source/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-runtime:
    name: Android emulator lifecycle
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Pip-Android-native-libraries
          path: browser-source/android/app/src/main/jniLibs/
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
      - name: Enable KVM access on hosted runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run lifecycle and real adblock WebView regressions on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '35'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          working-directory: browser-source/android
          disable-animations: true
          script: |
            mkdir -p app/build/reports/androidTests/connected/debug/ux
            test_exit=0
            if [ "${{ inputs.live_youtube }}" = "true" ]; then
              gradle --no-daemon --max-workers=2 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.liveYoutube=true || test_exit=$?
            else
              gradle --no-daemon --max-workers=2 connectedDebugAndroidTest || test_exit=$?
            fi
            if [ "${{ inputs.live_youtube }}" = "true" ] && adb shell run-as com.psharehub.pip test -f files/live-youtube-probe.json; then
              adb exec-out run-as com.psharehub.pip cat files/live-youtube-probe.json > app/build/reports/androidTests/connected/debug/ux/Pip-Android-live-YouTube-probe.json
            fi
            if [ "${{ inputs.live_youtube }}" = "true" ] && adb shell run-as com.psharehub.pip test -f files/live-youtube-probe.png; then
              adb exec-out run-as com.psharehub.pip cat files/live-youtube-probe.png > app/build/reports/androidTests/connected/debug/ux/Pip-Android-live-YouTube-probe.png
            fi
            if [ "$test_exit" -ne 0 ]; then exit "$test_exit"; fi
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.psharehub.pip
            adb shell am start -n com.psharehub.pip/.MainActivity
            sleep 12
            adb exec-out screencap -p > app/build/reports/androidTests/connected/debug/ux/Pip-Android-UX-default.png
            adb shell wm size 720x1600
            adb shell wm density 320
            adb shell am force-stop com.psharehub.pip
            adb shell am start -n com.psharehub.pip/.MainActivity
            sleep 12
            adb exec-out screencap -p > app/build/reports/androidTests/connected/debug/ux/Pip-Android-UX-360x800dp.png
            adb shell settings put system font_scale 1.5
            adb shell am force-stop com.psharehub.pip
            adb shell am start -n com.psharehub.pip/.MainActivity
            sleep 10
            adb exec-out screencap -p > app/build/reports/androidTests/connected/debug/ux/Pip-Android-UX-font-150.png
            adb shell settings put system font_scale 2.0
            adb shell am force-stop com.psharehub.pip
            adb shell am start -n com.psharehub.pip/.MainActivity
            sleep 10
            adb exec-out screencap -p > app/build/reports/androidTests/connected/debug/ux/Pip-Android-UX-font-200.png
            adb shell input tap 300 120
            sleep 2
            adb exec-out screencap -p > app/build/reports/androidTests/connected/debug/ux/Pip-Android-UX-font-200-address-focused.png
            adb shell settings put system font_scale 1.0
            adb shell wm size reset
            adb shell wm density reset
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pip-Android-emulator-reports
          path: |
            browser-source/android/app/build/reports/androidTests/
            browser-source/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }} (development)
    if: github.event_name != 'workflow_dispatch' || inputs.live_youtube != true
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: browser-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
          targets: ${{ matrix.target }}
      - name: Check macOS source formatting
        run: rustfmt --edition 2021 --check crates/app/src/macos_main.rs
      - name: Test shared core and macOS shell
        run: |
          cargo test -p evergreen-core --locked
          cargo test -p evergreen-browser --bin pip-macos --features macos-shell --locked
      - name: Build macOS shell
        run: cargo build -p evergreen-browser --bin pip-macos --features macos-shell --release --locked --target ${{ matrix.target }}
      - name: Package development app
        run: bash scripts/package-macos.sh ${{ matrix.target }}
      - name: Verify packaged native WebView and toolbar
        env:
          PIP_VERIFY_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile, time
          arch = os.environ['PIP_VERIFY_ARCH']
          archives = list(pathlib.Path('dist').glob(f'Pip-macOS-{arch}-*.zip'))
          assert len(archives) == 1, 'Expected exactly one packaged macOS app'
          with tempfile.TemporaryDirectory(prefix='pip-native-ui-') as directory:
              subprocess.run(['ditto', '-x', '-k', str(archives[0]), directory], check=True)
              executable = pathlib.Path(directory) / 'Pip.app/Contents/MacOS/Pip'
              result = subprocess.run([str(executable), '--verify-ui'], capture_output=True, text=True, timeout=120)
              print(result.stdout)
              print(result.stderr)
              reports = []
              for line in result.stdout.splitlines():
                  try:
                      report = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(report, dict) and report.get('mode') == 'pip-macos-native-ui':
                      reports.append(report)
              assert len(reports) == 1, 'Native app did not emit its verification report'
              report = reports[0]
              pathlib.Path(f'dist/Pip-macOS-{arch}-native-ui.json').write_text(json.dumps(report, indent=2))
              assert result.returncode == 0 and report.get('ok') is True, 'Native UI verification failed'
              app_bundle = pathlib.Path(directory) / 'Pip.app'
              subprocess.run(['open', '-n', str(app_bundle)], check=True)
              time.sleep(12)
              screenshot = pathlib.Path(f'dist/Pip-macOS-{arch}-UX.png')
              subprocess.run(['screencapture', '-x', str(screenshot)], check=True)
              subprocess.run(['osascript', '-e', 'tell application "Pip" to quit'],
                             check=False, capture_output=True, text=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pip-macOS-${{ matrix.arch }}-development
          path: |
            browser-source/dist/Pip-macOS-*.zip
            browser-source/dist/Pip-macOS-*.sha256
            browser-source/dist/Pip-macOS-*-native-ui.json
            browser-source/dist/Pip-macOS-*-UX.png
          if-no-files-found: error
          retention-days: 7
