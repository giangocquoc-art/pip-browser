name: Prepare verified Pip release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: pip-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows release
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: browser-source
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify tag matches application versions
        id: version
        shell: pwsh
        run: |
          $app = Get-Content crates/app/Cargo.toml -Raw
          $installer = Get-Content crates/installer/Cargo.toml -Raw
          $version = [regex]::Match($app, '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"').Groups[1].Value
          $installerVersion = [regex]::Match($installer, '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"').Groups[1].Value
          if (-not $version -or $version -ne $installerVersion) {
            throw 'Browser and installer versions must both be set and match.'
          }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $($env:GITHUB_REF_NAME) does not match source version v$version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build Pip browser
        run: cargo build -p evergreen-browser --release --locked

      - name: Build installer payloads and source archive
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipBrowserBuild

      - name: Run tests
        # GitHub-hosted Windows runners use an elevated token; this one test
        # specifically assumes an unelevated interactive user process.
        run: cargo test --workspace --locked -- --skip test_is_process_elevated_returns_false_unelevated

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Prepare versioned source archive and checksums
        shell: pwsh
        env:
          PIP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = "dist/Pip-Setup-$env:PIP_VERSION-Windows-x64.exe"
          $sourceArchive = "dist/Pip-source-$env:PIP_VERSION.zip"
          Copy-Item -LiteralPath 'dist/PipSetup.exe' -Destination $installer -Force
          Copy-Item -LiteralPath crates/installer/assets/Pip-source.zip -Destination $sourceArchive -Force
          $paths = @($installer, $sourceArchive)
          foreach ($path in $paths) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Release asset is missing: $path" }
          }
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          Set-Content -LiteralPath dist/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload release assets for attestation and publishing
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pip-release-assets
          path: |
            browser-source/dist/Pip-Setup-${{ steps.version.outputs.version }}-Windows-x64.exe
            browser-source/dist/Pip-source-${{ steps.version.outputs.version }}.zip
            browser-source/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest release assets
    needs: [build, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pip-release-assets
          path: browser-source/dist

      - name: Attest installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: browser-source/dist/Pip-Setup-${{ needs.build.outputs.version }}-Windows-x64.exe

      - name: Attest source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: browser-source/dist/Pip-source-${{ needs.build.outputs.version }}.zip

  dependency-audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked Rust dependencies
        run: cargo audit --file browser-source/Cargo.lock

  publish-draft:
    name: Create draft release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: browser-source
    steps:
      - name: Check out tagged source for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pip-release-assets
          path: browser-source/dist

      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PIP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY
          $setup = "dist/Pip-Setup-$env:PIP_VERSION-Windows-x64.exe"
          $source = "dist/Pip-source-$env:PIP_VERSION.zip"
          $checksums = 'dist/SHA256SUMS.txt'
          $productNotes = Get-Content -LiteralPath 'RELEASE_NOTES.md' -Raw
          $verificationNotes = @"
          ## Verify this release

          The installer and source archive have GitHub artifact attestations. After downloading them, verify their source and build provenance with GitHub CLI:

          ``````powershell
          gh attestation verify .\Pip-Setup-$env:PIP_VERSION-Windows-x64.exe --repo $repository
          gh attestation verify .\Pip-source-$env:PIP_VERSION.zip --repo $repository
          ``````

          Compare downloaded file hashes with ``SHA256SUMS.txt`` as an additional integrity check. Artifact attestations establish where and how the files were built; they are not Windows Authenticode signatures and do not remove SmartScreen warnings.
          "@
          $notes = "$productNotes`n`n$verificationNotes"
          $notesPath = 'dist/RELEASE_NOTES.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

          $existing = gh release view $tag --repo $repository --json isDraft --jq .isDraft 2>$null
          $viewExit = $LASTEXITCODE
          if ($viewExit -eq 0) {
            if ($existing.Trim() -ne 'true') { throw "Refusing to modify already-published release $tag." }
            gh release upload $tag $setup $source $checksums --repo $repository --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload assets to the draft release.' }
            gh release edit $tag --repo $repository --title "Pip $env:PIP_VERSION" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not update draft release notes.' }
          } else {
            gh release create $tag $setup $source $checksums --repo $repository --draft --title "Pip $env:PIP_VERSION" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
          }

          $release = gh release view $tag --repo $repository --json tagName,isDraft,body,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tagName -ne $tag -or -not $release.isDraft) {
            throw "Draft release validation failed for $tag."
          }
          $expectedAssets = @("Pip-Setup-$env:PIP_VERSION-Windows-x64.exe", "Pip-source-$env:PIP_VERSION.zip", 'SHA256SUMS.txt')
          $actualAssets = @($release.assets | ForEach-Object { $_.name })
          foreach ($assetName in $expectedAssets) {
            if ($assetName -notin $actualAssets) { throw "Draft release is missing asset $assetName." }
          }
          if (-not $release.body.Contains($productNotes.Trim())) {
            throw 'Draft release is missing the product release notes.'
          }
