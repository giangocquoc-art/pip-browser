[package]
name = "evergreen-browser"
default-run = "evergreen-browser"
version = "0.1.18"
edition = "2021"
authors = ["Evergreen Browser Contributors"]
description = "Ultra-lightweight, privacy-first desktop browser shell for Windows"
license = "MIT OR Apache-2.0"

[features]
macos-shell = ["adblock/content-blocking"]

[[bin]]
name = "pip-macos"
path = "src/macos_main.rs"
required-features = ["macos-shell"]

[dependencies]
evergreen-core = { path = "../core" }
base64 = "0.22"
winit = "0.30"
wry = { version = "0.57", features = ["devtools"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
aes-gcm = "0.10"
hkdf = "0.13"
rand = "0.8"
sha2 = "0.10"
semver = "1.0"
thiserror = "2.0"
adblock = { version = "0.13.3", default-features = false, features = ["css-validation", "embedded-domain-resolver", "full-regex-handling", "single-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSApplication"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController"] }
block2 = "0.6"

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows = { version = "0.62.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_Security_Cryptography",
] }

[build-dependencies]
winres = "0.1"

