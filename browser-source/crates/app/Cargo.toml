[package]
name = "evergreen-browser"
version = "0.1.6"
edition = "2021"
authors = ["Evergreen Browser Contributors"]
description = "Ultra-lightweight, privacy-first desktop browser shell for Windows"
license = "MIT OR Apache-2.0"

[dependencies]
evergreen-core = { path = "../core" }
winit = "0.30"
wry = { version = "0.57", features = ["devtools"] }
serde_json = "1.0"
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "single-thread"] }

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
windows = { version = "0.62.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[build-dependencies]
winres = "0.1"

