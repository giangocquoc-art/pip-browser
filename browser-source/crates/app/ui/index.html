<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pip</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,{{LOGO_BASE64}}">
  <style>
    :root {
      color-scheme: dark;
      --bg-chrome: #1e1e26;
      --bg-tab: #272733;
      --bg-tab-active: #141419;
      --bg-tab-hover: #2f2f3f;
      --bg-omnibox: #262633;
      --bg-omnibox-focus: #181820;
      --text-main: #f3f3f8;
      --text-muted: #9595a6;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #4e8cff;
      --accent: #4e8cff;
      --accent-green: #34d399;
      --accent-amber: #f59e0b;
      --danger-color: #ef4444;
      --font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: transparent;
      color: var(--text-main);
      font-family: var(--font-family);
      font-size: 13px;
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border-subtle);
    }

    svg {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* Tab Strip */
    .tab-strip {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 5px 8px 0 8px;
      gap: 4px;
      background: var(--bg-chrome);
      overflow: hidden;
      scrollbar-width: none;
    }

    .tab-strip::-webkit-scrollbar {
      display: none;
    }

    #tabsContainer {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      flex: 1 1 auto;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #tabsContainer::-webkit-scrollbar { display: none; }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 33px;
      min-width: 140px;
      max-width: 240px;
      padding: 0 10px;
      background: var(--bg-tab);
      border-radius: 8px 8px 0 0;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;

      position: relative;
      border: 1px solid transparent;
      border-bottom: none;
    }

    .tab.grouped {
      border-top: 3px solid var(--tab-group-color);
    }

    .tab.sleeping .tab-title {
      opacity: 0.72;
    }

    .tab.keep-awake .tab-title {
      text-decoration: underline dotted var(--accent);
      text-underline-offset: 3px;
    }

    .tab-group-label {
      flex: 0 1 auto;
      max-width: 58px;
      overflow: hidden;
      color: var(--tab-group-color);
      font-size: 10px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab.active {
      background: var(--bg-tab-active);
      color: var(--text-main);
      font-weight: 500;
      border-color: var(--border-subtle);
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.25);
    }

    .tab:hover:not(.active) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .tab.dragging {
      opacity: 0.5;
    }

    .tab * {
      pointer-events: none;
    }

    .tab .tab-close {
      pointer-events: auto;
    }

    .tab.drag-over-left {
      border-left: 3px solid #388bfd !important;
      box-shadow: -3px 0 8px rgba(56, 139, 253, 0.5) !important;
    }

    .tab.drag-over-right {
      border-right: 3px solid #388bfd !important;
      box-shadow: 3px 0 8px rgba(56, 139, 253, 0.5) !important;
    }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      opacity: 0.6;
      cursor: pointer;
      flex-shrink: 0;

    }

    .tab-close:hover {
      background: rgba(255, 255, 255, 0.15);
      opacity: 1;
      color: var(--danger-color);
    }

    .tab-close svg {
      width: 12px;
      height: 12px;
    }

    .new-tab-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;

    }

    .new-tab-btn:hover {
      background: var(--bg-tab);
      color: var(--text-main);
    }

    .new-tab-btn:active {
      transform: scale(0.92);
    }

    .new-tab-btn svg {
      width: 16px;
      height: 16px;
    }

    .window-controls {
      display: flex;
      align-items: stretch;
      align-self: stretch;
      flex: 0 0 auto;
      margin: -5px -8px 0 4px;
      padding-top: 5px;
      gap: 0;
      background: transparent;
    }
    .window-control {
      display: grid;
      place-items: center;
      width: 46px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      padding: 0;
    }
    .window-control svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .window-control:hover { background: rgba(30, 41, 59, .09); }
    .window-control.close:hover { background: #c42b1c; color: white; }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      height: 38px;
      padding: 0 8px;
      gap: 6px;
      background: var(--bg-tab-active);
      border-top: 1px solid var(--border-subtle);
      position: relative;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;

    }

    :focus-visible {
      outline: 2px solid var(--accent) !important;
      outline-offset: 2px !important;
    }

    .tab:focus-visible {
      outline: 2px solid var(--accent) !important;
      outline-offset: -2px !important;
    }

    button:focus:not(:focus-visible),
    .nav-btn:focus:not(:focus-visible),
    .tab-add-btn:focus:not(:focus-visible),
    .omnibox-lock-btn:focus:not(:focus-visible) {
      outline: none;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--bg-tab-hover);
      color: var(--text-main);
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.92);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Omnibox */
    .omnibox-container {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      min-width: 0;
    }

    /* Interactive Padlock / Security Inspector Button */
    .omnibox-lock-btn {
      position: absolute;
      left: 6px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);

      z-index: 2;
    }

    .omnibox-lock-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .omnibox-lock-btn:active {
      transform: scale(0.92);
    }

    .omnibox-lock-btn.secure {
      color: var(--accent-green);
    }

    .omnibox-lock-btn.insecure {
      color: var(--accent-amber);
    }

    .omnibox-lock-btn.internal {
      color: var(--accent-blue);
    }

    .omnibox-lock-btn svg {
      width: 13px;
      height: 13px;
    }

    .omnibox {
      width: 100%;
      height: 28px;
      background: var(--bg-omnibox);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0 14px 0 32px;
      color: var(--text-main);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      user-select: text;

    }

    .omnibox:focus {
      border-color: var(--border-focus);
      background: var(--bg-omnibox-focus);
    }

    .omnibox-suggestions {
      position: absolute;
      z-index: 1200;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      max-height: 320px;
      overflow: auto;
      padding: 5px;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--bg-tab-active, #fff);
      box-shadow: 0 8px 24px rgba(25, 32, 44, .18);
    }

    .omnibox-suggestions[hidden] { display: none; }
    .omnibox-suggestion {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
    }
    .omnibox-suggestion:hover,
    .omnibox-suggestion[aria-selected="true"] { background: var(--bg-tab-hover, #f2f4f8); }
    .omnibox-suggestion-icon { flex: 0 0 16px; color: var(--text-muted); text-align: center; }
    .omnibox-suggestion-copy { min-width: 0; display: grid; gap: 2px; }
    .omnibox-suggestion-title,
    .omnibox-suggestion-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .omnibox-suggestion-title { font-size: 12px; }
    .omnibox-suggestion-url { color: var(--text-muted); font-size: 10px; }

    /* Tab Dragging Styles */
    .tab.dragging {
      opacity: 0.45;
      transform: scale(0.96);
    }

    .tab.drag-over-left {
      border-left: 3px solid #388bfd !important;
      box-shadow: -3px 0 8px rgba(56, 139, 253, 0.5) !important;
    }

    .tab.drag-over-right {
      border-right: 3px solid #388bfd !important;
      box-shadow: 3px 0 8px rgba(56, 139, 253, 0.5) !important;
    }

    /* Zoom Badge & Dialog */
    .zoom-badge {
      position: absolute;
      right: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      cursor: pointer;
      z-index: 3;

    }

    .zoom-badge:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--border-focus);
    }

    .zoom-dialog {
      position: absolute;
      right: 0;
      top: 36px;
      background: #1e1e28;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      z-index: 100;

    }

    .zoom-dialog-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #272733;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .zoom-dialog-btn:hover {
      background: #333344;
    }

    .zoom-dialog-reset {
      padding: 2px 8px;
      height: 24px;
      background: #272733;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
    }

    .zoom-dialog-reset:hover {
      background: #333344;
    }

    /* Downloads Toolbar & Progress Ring */
    .download-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .download-btn .download-icon {
      width: 14px;
      height: 14px;
      z-index: 1;
    }

    .download-ring {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px !important;
      height: 24px !important;
      pointer-events: none;
      transform: rotate(-90deg);
      z-index: 2;
    }

    .download-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 2.5;
    }

    .download-ring-fill {
      fill: none;
      stroke: var(--accent-blue);
      stroke-width: 2.5;
      stroke-dasharray: 81.68;
      stroke-dashoffset: 81.68;

    }

    .download-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--accent-blue);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 14px;
      height: 14px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      z-index: 3;
    }

    /* Find In Page Tray */
    .find-bar {
      display: none;
      align-items: center;
      justify-content: flex-end;
      height: 38px;
      padding: 0 16px;
      gap: 8px;
      background: var(--bg-tab-active);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;

    }

    .find-input {
      width: 220px;
      height: 26px;
      background: #14141a;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0 8px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }

    .find-input:focus {
      border-color: var(--border-focus);
    }

    .find-count {
      font-size: 11px;
      color: var(--text-muted);
      min-width: 44px;
      text-align: center;
    }

    .find-btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
    }

    .find-btn:hover {
      background: #2b2b3b;
      color: var(--text-main);
    }

    /* Permission Prompt Tray */
    .permission-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      height: 38px;
      padding: 0 16px;
      background: #1e1e28;
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;

    }

    .permission-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-main);
    }

    .permission-icon {
      width: 16px;
      height: 16px;
      color: var(--accent-blue);
    }

    .permission-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .permission-btn {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      border: none;
      cursor: pointer;

    }

    .permission-btn.allow {
      background: var(--accent-green);
      color: #0b1a13;
    }

    .permission-btn.allow:hover {
      background: #4ade80;
    }

    .permission-btn.block {
      background: #2b2b3b;
      color: var(--text-main);
    }

    .permission-btn.block:hover {
      background: #38384d;
    }

    .permission-close {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 4px;
    }

    *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; backdrop-filter:none!important; }
</style>

}

.profile-list-title{margin:13px 5px 6px;font-size:11px;font-weight:700;color:#687589}.profile-list{display:grid;gap:3px}.profile-choice,.profile-popover-action{width:100%;min-height:36px;display:flex;align-items:center;gap:9px;padding:7px 9px;border:0;border-radius:9px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}.profile-choice:hover,.profile-popover-action:hover{background:#fff0e5}.profile-choice svg,.profile-popover-action svg{width:17px;height:17px;flex:0 0 auto;color:#8b6f5d}.profile-choice-name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-choice-current{font-size:10px;color:#b84b08}.profile-choice-current::after{content:'Đang dùng'}
.profile-choice:disabled,.profile-popover-action:disabled{opacity:.7;cursor:default}.profile-choice:disabled:hover,.profile-popover-action:disabled:hover{background:transparent}
.profile-popover-divider{height:1px;margin:8px 0;background:#f1e2d5}.profile-create-form{display:grid;grid-template-columns:1fr auto;gap:7px;padding:5px 0}.profile-create-form input{min-width:0;height:34px;padding:0 10px;border:1px solid #e7d6c9;border-radius:8px;color:#17202e;background:#fff;font:inherit}.profile-create-form input:focus{outline:2px solid #f97316;outline-offset:1px}.profile-create-form button{border:0;border-radius:8px;padding:0 12px;background:#f97316;color:white;font:600 12px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.find-input,.zoom-dialog,.zoom-dialog-btn,.zoom-dialog-reset,.permission-bar{background:var(--bg-tab-active);color:var(--text-main);border-color:var(--border-subtle)}
@media(max-width:760px){.connection-btn{padding:0 6px}.connection-btn span{display:none}#profileButton{max-width:62px!important}.nav-bar{gap:4px}}
@media(prefers-color-scheme:dark){.profile-popover{background:#222327;border-color:#493629;color:#f5f2ef;box-shadow:0 12px 32px rgba(0,0,0,.44)}.profile-current{background:linear-gradient(120deg,#3a291f,#292420);border-color:#614131}.profile-current-avatar{background:#4a3020;color:#ffb77e}.profile-current-copy span,.profile-list-title{color:#c1b8b0}.profile-choice:hover,.profile-popover-action:hover{background:#3a291f}.profile-choice svg,.profile-popover-action svg{color:#d0b6a2}.profile-choice-current{color:#ffb77e}.profile-popover-divider{background:#493629}.profile-create-form input{background:#292420;color:#f5eee8;border-color:#614131}}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg-chrome: #15161a;
    --bg-tab: #202126;
    --bg-tab-active: #292a2f;
    --bg-tab-hover: #303137;
    --bg-omnibox: #222329;
    --bg-omnibox-focus: #26272c;
    --text-main: #f5f5f6;
    --text-muted: #a2a4ae;
    --border-subtle: rgba(255,255,255,.09);
    --border-focus: #fb923c;
    --accent: #fb923c;
    --accent-blue: #fb923c;
    --accent-green: #4ade80;
  }
  .tab-strip{background:linear-gradient(100deg,#3c281f,#2e2521)}.nav-bar{background:#292420;border-color:#614131}.tab{background:#3b2c24;color:#cbbcaf}.tab.active{background:#302822;color:#fff4e9}.omnibox-container{border-color:#614131}.connection-btn{background:#38291f;color:#f2c4a1;border-color:#795139}.connection-btn[aria-pressed="true"]{background:#55321d;color:#ffb77e;border-color:#b8672c}.nav-btn:hover,.new-tab-btn:hover{background:#4a3020;color:#ffb77e}.window-control{color:#f5eee8}.window-control:hover{background:#ffffff18}.window-control.close:hover{background:#c42b1c;color:#fff}
  .zoom-dialog{background:#292420;border-color:#614131}.zoom-dialog-btn,.zoom-dialog-reset,.find-input{background:#302822;border-color:#614131;color:#f5eee8}.zoom-dialog-btn:hover,.zoom-dialog-reset:hover,.find-btn:hover{background:#4a3020;color:#ffb77e}.permission-bar{background:#292420;border-color:#614131}.permission-btn.block{background:#3b2c24;color:#f5eee8}.permission-btn.block:hover{background:#4a3020}.find-count{color:#d0c0b4}#statusPreviewBar{background:#292420!important;color:#f5eee8!important;border-color:#614131!important}
}

</style>
<!-- FEATHER_STYLE_END -->

</head>
<body>
  <!-- Tab Strip -->
  <div class="tab-strip" id="tabStrip">
    <div id="tabsContainer" role="tablist" aria-label="Thẻ trình duyệt" aria-describedby="tabKeyboardHint"></div><span id="tabKeyboardHint" hidden>Dùng phím mũi tên để chuyển tab. Delete hoặc Ctrl+W đóng tab đang chọn.</span>
    <button class="new-tab-btn" id="newTabBtn" onclick="createNewTab()" title="Tab mới (Ctrl+T)" aria-label="Tab mới">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="window-controls" role="group" aria-label="Điều khiển cửa sổ">
      <button class="window-control" onclick="postIpc('WindowMinimize')" title="Thu nhỏ" aria-label="Thu nhỏ cửa sổ"><svg viewBox="0 0 12 12"><path d="M2 9.5h8"/></svg></button>
      <button class="window-control" onclick="postIpc('WindowToggleMaximize')" title="Phóng to hoặc khôi phục" aria-label="Phóng to hoặc khôi phục cửa sổ"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx=".5"/></svg></button>
      <button class="window-control close" onclick="postIpc('WindowClose')" title="Đóng" aria-label="Đóng cửa sổ"><svg viewBox="0 0 12 12"><path d="m2.5 2.5 7 7m0-7-7 7"/></svg></button>
    </div>
  </div>

  <script>
    document.getElementById('tabStrip').addEventListener('pointerdown', event => {
      if (event.button === 0 && !event.target.closest('.tab,button')) postIpc('WindowDrag');
    });
    document.getElementById('tabStrip').addEventListener('dblclick', event => {
      if (!event.target.closest('.tab,button')) postIpc('WindowToggleMaximize');
    });
  </script>

  <!-- Navigation Bar -->
  <div class="nav-bar" role="toolbar" aria-label="Điều hướng">
    <button class="nav-btn" id="btnBack" onclick="goBack()" disabled title="Quay lại (Alt+←)" aria-label="Quay lại">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="nav-btn" id="btnForward" onclick="goForward()" disabled title="Tiến tới (Alt+→)" aria-label="Tiến tới">
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
    <button class="nav-btn" id="btnReload" onclick="reloadPage()" title="Tải lại (Ctrl+R / F5)" aria-label="Tải lại">
      <svg viewBox="0 0 24 24">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
    </button>
    <button class="nav-btn" id="btnHome" onclick="postIpc('Navigate',{url:'evergreen://newtab'})" title="Trang chủ Pip (Alt+Home)" aria-label="Trang chủ">
      <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>
    </button>

    <div class="omnibox-container">
      <!-- Interactive Padlock Button -->
      <button class="omnibox-lock-btn secure" id="btnLock" onclick="toggleSecurityPanel(event)" title="Xem thông tin và chứng chỉ trang web" aria-label="Thông tin bảo mật trang web">
        <svg viewBox="0 0 24 24" id="lockIcon">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </button>

      <input
        type="text"
        class="omnibox"
        id="omnibox"
        role="combobox"
        aria-expanded="false"
        aria-autocomplete="list"
        aria-haspopup="listbox"
        aria-controls="omniboxSuggestions"
        aria-label="Địa chỉ và tìm kiếm"
        placeholder="Tìm kiếm {{SEARCH_ENGINE_NAME}} hoặc nhập địa chỉ web..."
        oninput="requestOmniboxSuggestions(event)"
        onblur="setTimeout(closeOmniboxSuggestions, 100)"
        onkeydown="handleOmniboxKey(event)"
      />
      <div id="omniboxSuggestions" class="omnibox-suggestions" role="listbox" aria-label="Gợi ý dấu trang và lịch sử" hidden></div>

      <!-- Zoom Badge & Dialog -->
      <button class="zoom-badge" id="zoomBadge" onclick="toggleZoomDialog(event)" style="display: none;">100%</button>
      <div class="zoom-dialog" id="zoomDialog" style="display: none;" onclick="event.stopPropagation()">
        <button class="zoom-dialog-btn" id="zoomOutBtn" onclick="zoomOut()" title="Thu nhỏ (Ctrl+-)">−</button>
        <button class="zoom-dialog-reset" onclick="zoomReset()" id="zoomResetBtn" title="Khôi phục tỷ lệ (Ctrl+0)">100%</button>
        <button class="zoom-dialog-btn" id="zoomInBtn" onclick="zoomIn()" title="Phóng to (Ctrl++)">+</button>
      </div>
    </div>

    <button id="profileButton" class="nav-btn profile-trigger" aria-haspopup="dialog" aria-expanded="false" onclick="toggleProfileMenu(event)" title="Hồ sơ Pip: mở cửa sổ có đăng nhập, lịch sử và dấu trang riêng">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M6.8 19a5.7 5.7 0 0 1 10.4 0"/></svg>
      <span id="profileButtonLabel" class="profile-trigger-label">{{PROFILE_LABEL}}{{PRIVATE_LABEL}}</span>
    </button>
    <section id="profilePopover" class="profile-popover" role="dialog" aria-label="Hồ sơ Pip" hidden onclick="event.stopPropagation()">
      <div class="profile-current"><div class="profile-current-avatar" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M6.8 19a5.7 5.7 0 0 1 10.4 0"/></svg></div><div class="profile-current-copy"><strong id="profileCurrentName">Pip</strong><span>Hồ sơ riêng trên thiết bị này</span></div></div>
      <div class="profile-list-title">Các hồ sơ Pip</div>
      <div class="profile-list" id="profileList"></div>
      <div class="profile-popover-divider"></div>
      <button class="profile-popover-action" id="profileAddButton" type="button" onclick="showProfileCreate(event)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Thêm hồ sơ Pip</span></button>
      <form id="profileCreateForm" class="profile-create-form" hidden onsubmit="createProfileFromMenu(event)"><input id="profileCreateName" maxlength="40" autocomplete="off" placeholder="Tên hồ sơ mới" aria-label="Tên hồ sơ mới"><button type="submit">Tạo</button></form>
      <button class="profile-popover-action" type="button" onclick="closeProfileMenu();postIpc('OpenSettings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.5 7.5 0 0 0 0-3l2-1.5-2-3.5-2.4 1a8 8 0 0 0-2.6-1.5L13.5 2h-4L9 5a8 8 0 0 0-2.6 1.5L4 5.5 2 9l2 1.5a7.5 7.5 0 0 0 0 3L2 15l2 3.5 2.4-1A8 8 0 0 0 9 19l.5 3h4l.5-3a8 8 0 0 0 2.6-1.5l2.4 1 2-3.5z"/></svg><span>Quản lý hồ sơ và quyền riêng tư</span></button>
    </section>

    <button class="nav-btn" id="bookmarkButton" aria-label="Lưu dấu trang" aria-pressed="false" title="Lưu / bỏ trang hiện tại trong dấu trang của hồ sơ này (Ctrl+D)" onclick="postIpc('ToggleBookmark')"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3l-5.6 2.9 1.1-6.2L3 9.6l6.2-.9z"/></svg></button>
    <button class="nav-btn" id="adblockButton" aria-label="Chặn quảng cáo" title="Chặn quảng cáo trên trang này (Ctrl+Shift+A)" onclick="postIpc('ToggleAdblock')" disabled><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg></button>
    <button id="googleDnsButton" class="connection-btn" disabled aria-pressed="false" aria-label="Google DNS" title="Google DNS" onclick="toggleGoogleDns()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><span>G DNS</span></button>

    <!-- Downloads Toolbar Button -->
    <button class="nav-btn download-btn" id="btnDownloads" onclick="toggleDownloadsShelf(event)" title="Tải xuống (Ctrl+J)" aria-label="Tải xuống">
      <svg class="download-icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <div class="download-badge" id="downloadBadge" style="display: none;">0</div>
      <svg class="download-ring" id="downloadRing" viewBox="0 0 32 32" style="display: none;">
        <circle cx="16" cy="16" r="13" class="download-ring-bg"/>
        <circle cx="16" cy="16" r="13" class="download-ring-fill" id="downloadRingFill"/>
      </svg>
    </button>

    <!-- 3-Dot Menu Toggle (Toggles WinUI 3 Sidebar Panel) -->
    <button class="nav-btn" id="btnMenu" onclick="toggleMenuPanel(event)" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="1.5"/>
        <circle cx="12" cy="5" r="1.5"/>
        <circle cx="12" cy="19" r="1.5"/>
      </svg>
    </button>
  </div>

  <!-- Find In Page Tray (Expandable 3rd Row) -->
  <div class="find-bar" id="findBar" onclick="event.stopPropagation()">
    <input type="text" id="findInput" class="find-input" placeholder="Tìm trong trang..." oninput="executeFind(false)" onkeydown="handleFindKey(event)"/>
    <span class="find-count" id="findCount">0/0</span>
    <button class="find-btn" onclick="executeFind(false)" title="Kết quả trước (Shift+Enter)">▲</button>
    <button class="find-btn" onclick="executeFind(true)" title="Kết quả tiếp (Enter)">▼</button>
    <button class="find-btn" id="closeFindBarBtn" onclick="closeFindBar()" title="Đóng (Esc)">✕</button>
  </div>

  <!-- Permission Prompt Tray (Expandable 3rd Row) -->
  <div class="permission-bar" id="permissionBar" onclick="event.stopPropagation()">
    <div class="permission-info">
      <svg class="permission-icon" id="permissionIcon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span class="permission-msg" id="permissionMsg"></span>
    </div>
    <div class="permission-actions">
      <button class="permission-btn allow" id="permissionAllowBtn" onclick="resolvePermission(true)">Cho phép</button>
      <button class="permission-btn block" id="permissionBlockBtn" onclick="resolvePermission(false)">Chặn</button>
      <button class="permission-close" id="permissionDismissBtn" onclick="dismissPermission()">✕</button>
    </div>
  </div>

  <!-- Live Status & Link Destination Preview Bar (Windows Narrator live region) -->
  <div id="statusPreviewBar" role="status" aria-live="polite" style="display:none; position:fixed; bottom:0; left:0; max-width:500px; padding:3px 10px; background:rgba(20,20,26,0.96); color:#cbd5e1; font-size:11px; z-index:99999; border-top-right-radius:6px; border:1px solid rgba(255,255,255,0.12); pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>

  <script>
    let pipSettings={features:{},tabs:{},appearance:{},downloads:{}};
    window.__applySettings = settings => {
      pipSettings=settings;
      document.getElementById('btnDownloads').hidden=!settings.features.enable_downloads_manager;
      if(!settings.appearance.show_zoom_badge||!settings.features.enable_zoom_controls)document.getElementById('zoomBadge').style.display='none';
      if(!settings.features.enable_find_in_page)closeFindBar();
      if(!settings.downloads.show_progress_toolbar){document.getElementById('downloadBadge').style.display='none';document.getElementById('downloadRing').style.display='none';}
    };
    let activeTabId = null;
    let activePageUrl = null;
    let draggedTabId = null;
    let draggedTabIndex = null;
    let reorderDropped = false;

    function postIpc(action, payload = null) {
      if (window.ipc) {
        window.ipc.postMessage(JSON.stringify({ action, payload }));
      } else {
        console.log('[IPC OUT]', action, payload);
      }
    }

    function sendAction(action) {
      postIpc(action);
    }

    function toggleProfileMenu(event) {
      if (event) event.stopPropagation();
      const popover = document.getElementById('profilePopover');
      if (popover.hidden) {
        popover.hidden = false;
        document.getElementById('profileButton').setAttribute('aria-expanded', 'true');
        postIpc('MenuToggled', {open:true});
      } else {
        closeProfileMenu();
      }
    }
    window.toggleProfileMenu = toggleProfileMenu;
    function closeProfileMenu() {
      const popover = document.getElementById('profilePopover');
      if (!popover || popover.hidden) return;
      popover.hidden = true;
      document.getElementById('profileButton').setAttribute('aria-expanded', 'false');
      postIpc('MenuToggled', {open:false});
    }
    function showProfileCreate(event) {
      if (event) event.stopPropagation();
      const form = document.getElementById('profileCreateForm');
      form.hidden = false;
      document.getElementById('profileCreateName').focus();
    }
    function createProfileFromMenu(event) {
      event.preventDefault();
      const input = document.getElementById('profileCreateName');
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      postIpc('CreateProfile', {name});
      input.value = '';
      closeProfileMenu();
    }
    window.__renderProfileMenu = (profiles, currentId, isPrivate) => {
      const current = profiles.find(profile => profile.id === currentId);
      const name = current?.name || 'Hồ sơ Pip';
      document.getElementById('profileButtonLabel').textContent = name + (isPrivate ? ' · Ẩn danh' : '');
      document.getElementById('profileCurrentName').textContent = name + (isPrivate ? ' · Ẩn danh' : '');
      const list = document.getElementById('profileList');
      list.replaceChildren();
      const addButton = document.getElementById('profileAddButton');
      addButton.disabled = profiles.length >= 20;
      addButton.title = addButton.disabled ? 'Đã đạt giới hạn 20 hồ sơ' : 'Tạo hồ sơ mới';
      for (const profile of profiles) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'profile-choice';
        button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M6.8 19a5.7 5.7 0 0 1 10.4 0"/></svg><span class="profile-choice-name"></span><span class="profile-choice-current"></span>';
        button.querySelector('.profile-choice-name').textContent = profile.name;
        const active = profile.id === currentId && !isPrivate;
        const mark = button.querySelector('.profile-choice-current');
        mark.hidden = !active;
        button.disabled = active;
        button.setAttribute('aria-current', active ? 'true' : 'false');
        button.title = active ? 'Hồ sơ đang dùng' : 'Mở cửa sổ hồ sơ này';
        if (!active) button.addEventListener('click', () => {
          postIpc('OpenProfile', {id:profile.id});
          closeProfileMenu();
        });
        list.append(button);
      }
    };
    document.addEventListener('click', closeProfileMenu);
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && !document.getElementById('profilePopover').hidden) { closeProfileMenu(); document.getElementById('profileButton').focus(); } });

    function createNewTab() {
      postIpc('CreateTab', { url: null });
    }

    let omniboxSuggestionItems = [];
    let omniboxSuggestionIndex = -1;
    let omniboxSuggestionTimer = null;
    function closeOmniboxSuggestions() {
      const list = document.getElementById('omniboxSuggestions');
      if (!list) return;
      list.hidden = true;
      document.getElementById('omnibox').setAttribute('aria-expanded', 'false');
      document.getElementById('omnibox').removeAttribute('aria-activedescendant');
      omniboxSuggestionItems = [];
      omniboxSuggestionIndex = -1;
    }
    function requestOmniboxSuggestions(event) {
      const query = event.target.value.trim();
      clearTimeout(omniboxSuggestionTimer);
      if (!query) {
        closeOmniboxSuggestions();
        return;
      }
      omniboxSuggestionTimer = setTimeout(() => postIpc('SuggestOmnibox', { query }), 90);
    }
    window.__renderOmniboxSuggestions = function(query, items) {
      const input = document.getElementById('omnibox');
      const list = document.getElementById('omniboxSuggestions');
      if (!input || !list || input.value.trim() !== String(query).trim() || document.activeElement !== input) return;
      list.replaceChildren();
      omniboxSuggestionItems = Array.isArray(items) ? items.slice(0, 8) : [];
      omniboxSuggestionIndex = -1;
      if (!omniboxSuggestionItems.length) {
        closeOmniboxSuggestions();
        return;
      }
      for (let i = 0; i < omniboxSuggestionItems.length; i++) {
        const item = omniboxSuggestionItems[i];
        const button = document.createElement('button');
        button.type = 'button';
        button.id = `omnibox-suggestion-${i}`;
        button.className = 'omnibox-suggestion';
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', 'false');
        button.addEventListener('mousedown', event => event.preventDefault());
        button.addEventListener('click', () => navigateOmnibox(item.url));
        const icon = document.createElement('span');
        icon.className = 'omnibox-suggestion-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = item.bookmarked ? '★' : '◷';
        const copy = document.createElement('span');
        copy.className = 'omnibox-suggestion-copy';
        const title = document.createElement('span');
        title.className = 'omnibox-suggestion-title';
        title.textContent = item.title || item.url;
        const url = document.createElement('span');
        url.className = 'omnibox-suggestion-url';
        url.textContent = item.url;
        copy.append(title, url);
        button.append(icon, copy);
        list.append(button);
      }
      list.hidden = false;
      input.setAttribute('aria-expanded', 'true');
    };
    function selectOmniboxSuggestion(index) {
      if (!omniboxSuggestionItems.length) return false;
      omniboxSuggestionIndex = (index + omniboxSuggestionItems.length) % omniboxSuggestionItems.length;
      const input = document.getElementById('omnibox');
      for (let i = 0; i < omniboxSuggestionItems.length; i++) {
        document.getElementById(`omnibox-suggestion-${i}`)?.setAttribute('aria-selected', String(i === omniboxSuggestionIndex));
      }
      input.setAttribute('aria-activedescendant', `omnibox-suggestion-${omniboxSuggestionIndex}`);
      document.getElementById(`omnibox-suggestion-${omniboxSuggestionIndex}`)?.scrollIntoView({block:'nearest'});
      return true;
    }
    function navigateOmnibox(url) {
      closeOmniboxSuggestions();
      postIpc('Navigate', {url});
    }

    function closeTab(id, event) {

      badge.style.display = activeCount > 0 ? 'flex' : 'none';
      ring.style.display = activeCount > 0 ? 'block' : 'none';

      let totalExpected = 0;
      for (const item of activeDownloads.values()) {
        if (item.state === 'InProgress') {
          totalReceived += item.received;
          totalExpected += item.total;
        }

      if (totalExpected > 0) {

      }
      document.getElementById('googleDnsButton').disabled = true;
      postIpc('SetGoogleDns', {enabled: !googleDnsEnabled});
    }
    window.__renderGoogleDns = function(enabled, active, failed = false, routeOk = null) {
      googleDnsEnabled = enabled;
      googleDnsActive = active;
      googleDnsFailed = failed;
      const button = document.getElementById('googleDnsButton');
      button.disabled = false;
      button.setAttribute('aria-pressed', String(enabled));
      const routeFailed = active && routeOk === false;
      button.dataset.failed = String(enabled && (failed || routeFailed));
      button.dataset.pending = String(!failed && enabled !== active);
      button.querySelector('span').textContent = failed && enabled && !active
        ? 'Cài đặt'
        : enabled !== active ? 'Áp dụng' : 'G DNS';
      button.title = failed && enabled
        ? 'Google DNS không khởi động được: Pip hiện đang dùng DNS Windows. Bấm để mở Cài đặt > Kết nối.'
        : enabled !== active
          ? 'Google DNS: đã lưu lựa chọn bật/tắt nhưng chưa áp dụng. Bấm để khởi động lại Pip và áp dụng.'
          : routeFailed
            ? 'Google DNS chưa kết nối được: proxy đang chạy nhưng tuyến HTTPS chưa qua kiểm tra. Mở Cài đặt > Kết nối để thử lại.'
            : active && routeOk === null
              ? 'Google DNS: proxy đang chạy; Pip đang kiểm tra khả năng phân giải tên miền và tải trang.'
              : active && routeOk === true
                ? 'Google DNS: đã xác minh phân giải tên miền và tải trang qua proxy HTTPS của Pip.'
                : 'Google DNS: ' + (active ? 'đã cấu hình cho phiên Pip này' : 'đang tắt') + '. Vào Cài đặt > Kết nối để kiểm tra tuyến DNS.';
      button.setAttribute('aria-label', button.title);
    };

    window.__syncSearchEngine = function(engine) {
      const names = {
        'google': 'Google',
        'bing': 'Bing',
        'brave': 'Brave',
        'ecosia': 'Ecosia'
      };
      const name = names[engine ? engine.toLowerCase() : ''] || 'Google';
      const omnibox = document.getElementById('omnibox');
      if (omnibox) {
        omnibox.placeholder = `Tìm kiếm ${name} hoặc nhập địa chỉ web...`;
      }
    };

    document.addEventListener('click', (e) => {
      const zoomDialog = document.getElementById('zoomDialog');
      if (zoomDialog && !zoomDialog.contains(e.target) && e.target.id !== 'zoomBadge') {
        zoomDialog.style.display = 'none';
      }
    });

    function setupTablistKeyboardNav() {
      const container = document.getElementById('tabsContainer');
      container.addEventListener('keydown', (e) => {
        const tabs = Array.from(container.querySelectorAll('.tab'));
        if (!tabs.length) return;
        const currentIdx = tabs.findIndex(t => t === document.activeElement);
        if (currentIdx === -1) return;

        if (e.key === 'Delete') {
          e.preventDefault();
          closeTab(parseInt(tabs[currentIdx].id.replace('tab-', ''), 10), e);
          return;
        }
        let targetIdx = -1;
        if (e.key === 'ArrowRight') {
          targetIdx = (currentIdx + 1) % tabs.length;
        } else if (e.key === 'ArrowLeft') {
          targetIdx = (currentIdx - 1 + tabs.length) % tabs.length;
        } else if (e.key === 'Home') {
          targetIdx = 0;
        } else if (e.key === 'End') {
          targetIdx = tabs.length - 1;
        }

        if (targetIdx !== -1) {
          e.preventDefault();
          tabs[targetIdx].focus();
          const targetTabId = parseInt(tabs[targetIdx].id.replace('tab-', ''), 10);
          switchTab(targetTabId);
        }
      });
    }

    window.onload = () => {
      setupTablistKeyboardNav();
      postIpc('ChromeReady');
    };
  </script>
</body>
