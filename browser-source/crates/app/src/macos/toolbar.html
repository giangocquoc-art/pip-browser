<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff1e7;color:#172b3a;font:15px -apple-system,BlinkMacSystemFont,sans-serif}button,input{font:inherit}button{border:0;border-radius:8px;background:#fff9f4;color:inherit;min-height:32px;padding:4px 10px;cursor:pointer}button:hover,button[aria-selected=true]{background:#ffdbc1}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #ff730f;outline-offset:1px}#top{height:38px;display:flex;align-items:center;gap:8px;padding:3px 10px}#brand{display:flex;align-items:center;gap:6px;color:#e85d0d;font-weight:750}#brand img{width:25px;height:25px}#tabs{display:flex;gap:4px;overflow:auto;flex:1}.tab{display:flex;flex:none;max-width:210px;gap:2px}.tab .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}#nav{height:44px;display:flex;align-items:center;gap:5px;padding:4px 10px}form{flex:1}input{width:100%;height:36px;border:1px solid #e7d3c4;border-radius:18px;background:white;padding:0 15px;color:#172b3a}#notice{font-size:12px;height:28px;padding:3px 13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#5b6471}
form{min-width:80px}#shield{font-size:13px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div id="top"><span id="brand"><img alt="" src="data:image/png;base64,{{LOGO}}">Pip</span><div id="tabs" role="tablist" aria-label="Các tab"></div><button id="new" aria-label="Tab mới" title="Tab mới (⌘T)">＋</button></div>
<div id="nav"><button id="back" aria-label="Quay lại" title="Quay lại">←</button><button id="forward" aria-label="Tiến tới" title="Tiến tới">→</button><button id="reload" aria-label="Tải lại" title="Tải lại (⌘R)">↻</button><form id="navigate"><input id="address" aria-label="Tìm kiếm Google hoặc nhập địa chỉ web" placeholder="Tìm kiếm Google hoặc nhập địa chỉ web" autocomplete="off" spellcheck="false"></form><span id="shield" role="status" aria-live="polite">Đang chuẩn bị bộ lọc…</span></div>
<div id="notice" role="status">Bản macOS thử nghiệm · Bộ lọc WebKit chưa hỗ trợ đầy đủ scriptlet/YouTube · Chưa có Google DNS và đồng bộ.</div>
<script>
const send=message=>window.ipc.postMessage(JSON.stringify(message));
const address=document.querySelector('#address');
document.querySelector('#navigate').onsubmit=event=>{event.preventDefault();send({action:'navigate',input:address.value});address.blur()};
for(const action of ['back','forward','reload'])document.querySelector('#'+action).onclick=()=>send({action});
document.querySelector('#new').onclick=()=>send({action:'newTab'});
window.pipNotice=message=>{document.querySelector('#notice').textContent=message};
window.pipState=state=>{
 const tabs=document.querySelector('#tabs');tabs.replaceChildren();
 for(const tab of state.tabs){const item=document.createElement('div');item.className='tab';const select=document.createElement('button');select.className='label';select.setAttribute('role','tab');select.setAttribute('aria-selected',String(tab.id===state.activeId));select.title=tab.title||'Tab mới';select.textContent=(tab.loading?'◌ ':'')+(tab.title||'Tab mới');select.onclick=()=>send({action:'select',id:tab.id});const close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','Đóng '+(tab.title||'tab'));close.onclick=()=>send({action:'close',id:tab.id});item.append(select,close);tabs.append(item)}
 if(document.activeElement!==address)address.value=state.url;
 document.querySelector('#back').disabled=!state.back;document.querySelector('#forward').disabled=!state.forward;
 const shield=document.querySelector('#shield');shield.textContent=state.adblock;shield.title=state.adblock;shield.style.color=state.adblockReady?'#246438':'#9b361e';
};
document.addEventListener('keydown',event=>{if(!event.metaKey)return;const key=event.key.toLowerCase();if(key==='l'){event.preventDefault();address.focus();address.select()}else if(key==='t'){event.preventDefault();send({action:'newTab'})}else if(key==='r'){event.preventDefault();send({action:'reload'})}});
send({action:'ready'});
</script></body></html>
