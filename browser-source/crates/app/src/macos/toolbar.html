<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff1e7;color:#172b3a;font:15px -apple-system,BlinkMacSystemFont,sans-serif}button,input{font:inherit}button{border:0;border-radius:8px;background:#fff9f4;color:inherit;min-height:34px;padding:5px 10px;cursor:pointer}button:hover,button[aria-selected=true]{background:#ffdbc1}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #ff730f;outline-offset:1px}#top{height:38px;display:flex;align-items:center;gap:8px;padding:3px 10px}#brand{display:flex;align-items:center;gap:6px;color:#e85d0d;font-weight:750}#brand img{width:25px;height:25px}#tabs{display:flex;gap:4px;overflow:auto;flex:1}.tab{display:flex;flex:none;max-width:210px;gap:2px}.tab .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}#nav{height:44px;display:flex;align-items:center;gap:5px;padding:4px 10px}form{flex:1;min-width:80px}input{height:36px;border:1px solid #e7d3c4;border-radius:18px;background:white;padding:0 15px;color:#172b3a}#address{width:100%}#shield{font-size:13px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#notice{font-size:13px;min-height:28px;padding:5px 13px;color:#495766;border-top:1px solid #f3ddcf}#quick{display:flex;align-items:center;gap:5px;padding:0 10px 5px}#quick button{min-height:28px;font-size:13px}#findbar{display:none;gap:6px;padding:5px 10px;background:#fff9f4;border-top:1px solid #ead6c7}#findbar[aria-hidden=false]{display:flex}#find{flex:1;border-radius:8px}#panel{display:none;height:215px;margin:0 10px 8px;padding:8px 10px;background:#fff;border:1px solid #ead6c7;border-radius:10px;overflow:auto}#panel[aria-hidden=false]{display:block}#panelhead{display:flex;align-items:center;justify-content:space-between;font-weight:700}#panelitems{display:grid;gap:4px;margin-top:6px}#panelitems button{display:flex;justify-content:space-between;text-align:left;min-height:36px;border-bottom:1px solid #f1e9e2;background:#fff}#panelitems small{display:block;color:#69727c;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
</style></head><body>
<div id="top"><span id="brand"><img alt="" src="data:image/png;base64,{{LOGO}}">Pip</span><div id="tabs" role="tablist" aria-label="Các tab"></div><button id="new" aria-label="Tab mới" title="Tab mới (⌘T)">＋</button></div>
<div id="nav"><button id="back" aria-label="Quay lại" title="Quay lại">←</button><button id="forward" aria-label="Tiến tới" title="Tiến tới">→</button><button id="reload" aria-label="Tải lại" title="Tải lại (⌘R)">↻</button><form id="navigate"><input id="address" aria-label="Tìm kiếm Google hoặc nhập địa chỉ web" placeholder="Tìm kiếm Google hoặc nhập địa chỉ web" autocomplete="off" spellcheck="false"></form><button id="bookmark" aria-label="Thêm dấu trang" title="Dấu trang (⌘D)">☆</button><span id="shield" role="status" aria-live="polite">Đang chuẩn bị bộ lọc…</span></div>
<div id="quick" aria-label="Tác vụ trình duyệt"><button data-panel="history">Lịch sử</button><button data-panel="bookmarks">Dấu trang</button><button data-panel="downloads">Tải xuống</button><button id="findButton" title="Tìm trong trang (⌘F)">Tìm</button><button data-panel="about">Giới thiệu</button></div>
<div id="findbar" aria-hidden="true"><input id="find" aria-label="Tìm trong trang" placeholder="Tìm trong trang"><button id="findPrev" aria-label="Kết quả trước">↑</button><button id="findNext" aria-label="Kết quả tiếp">↓</button><button id="findClose" aria-label="Đóng tìm kiếm">Đóng</button></div>
<section id="panel" aria-hidden="true" aria-label="Bảng trình duyệt"><div id="panelhead"><span id="paneltitle"></span><button id="panelClose" aria-label="Đóng bảng">Đóng</button></div><div id="panelitems"></div></section>
<div id="notice" role="status" aria-live="polite">Pip macOS Preview · Một số tính năng chưa có trên macOS.</div>
<script>
const send=message=>window.ipc.postMessage(JSON.stringify(message));
const address=document.querySelector('#address');
document.querySelector('#navigate').onsubmit=event=>{event.preventDefault();send({action:'navigate',input:address.value});address.blur()};
for(const action of ['back','forward','reload'])document.querySelector('#'+action).onclick=()=>send({action});
document.querySelector('#new').onclick=()=>send({action:'newTab'});
document.querySelector('#bookmark').onclick=()=>send({action:'toggleBookmark'});
const panel=document.querySelector('#panel'),findbar=document.querySelector('#findbar');
const openPanel=name=>send({action:'openPanel',panel:name});
document.querySelectorAll('[data-panel]').forEach(button=>button.onclick=()=>openPanel(button.dataset.panel));
document.querySelector('#panelClose').onclick=()=>send({action:'closePanel'});
document.querySelector('#findButton').onclick=()=>send({action:'find'});document.querySelector('#findClose').onclick=()=>send({action:'closeFind'});
document.querySelector('#find').oninput=event=>window.pipAction('findText:'+event.target.value);
document.querySelector('#findNext').onclick=()=>send({action:'findNext'});document.querySelector('#findPrev').onclick=()=>send({action:'findPrevious'});
window.pipNotice=message=>{document.querySelector('#notice').textContent=message};
window.pipAction=action=>{
 if(action==='find'){findbar.setAttribute('aria-hidden','false');document.querySelector('#find').focus();document.querySelector('#find').select();return}
 if(action==='closeFind'){findbar.setAttribute('aria-hidden','true');return}
 if(action==='findNext'||action==='findPrevious'){const q=document.querySelector('#find').value;if(q)window.pipFind(q,action==='findPrevious');return}
 if(action.startsWith('findText:')){const q=action.slice(9);if(q)window.pipFind(q,false);return}
 if(action.startsWith('openPanel:')){const name=action.slice(10);panel.setAttribute('aria-hidden','false');document.querySelector('#paneltitle').textContent={history:'Lịch sử',bookmarks:'Dấu trang',downloads:'Tải xuống',about:'Giới thiệu về Pip'}[name]||'Pip';return}
 if(action==='closePanel'){panel.setAttribute('aria-hidden','true');return}
};
window.pipFind=(q,backward)=>send({action:'findText',query:q,backward});
function rows(items,kind){const target=document.querySelector('#panelitems');target.replaceChildren();if(!items.length){const empty=document.createElement('p');empty.textContent='Chưa có mục nào.';target.append(empty);return}for(const item of items){const button=document.createElement('button');button.type='button';if(kind==='about'){const text=document.createElement('span');text.textContent=item;button.append(text);button.disabled=true;}else{const title=document.createElement('strong');title.textContent=item.title||item.name||item.status;const url=document.createElement('small');url.textContent=item.url;button.append(title,url);button.onclick=()=>send({action:'openUrl',url:item.url});}target.append(button)}}
window.pipState=state=>{
 const tabs=document.querySelector('#tabs');tabs.replaceChildren();
 for(const tab of state.tabs){const item=document.createElement('div');item.className='tab';const select=document.createElement('button');select.className='label';select.setAttribute('role','tab');select.setAttribute('aria-selected',String(tab.id===state.activeId));select.title=tab.title||'Tab mới';select.textContent=(tab.loading?'◌ ':'')+(tab.title||'Tab mới');select.onclick=()=>send({action:'select',id:tab.id});const close=document.createElement('button');close.textContent='×';close.setAttribute('aria-label','Đóng '+(tab.title||'tab'));close.onclick=()=>send({action:'close',id:tab.id});item.append(select,close);tabs.append(item)}
 if(document.activeElement!==address)address.value=state.url;
 document.querySelector('#back').disabled=!state.back;document.querySelector('#forward').disabled=!state.forward;
 const shield=document.querySelector('#shield');shield.textContent=state.adblock;shield.title=state.adblock;shield.style.color=state.adblockReady?'#246438':'#9b361e';
 const bookmark=document.querySelector('#bookmark');bookmark.textContent=state.bookmarked?'★':'☆';bookmark.setAttribute('aria-label',state.bookmarked?'Xóa dấu trang':'Thêm dấu trang');
 if(panel.getAttribute('aria-hidden')==='false'){const name=document.querySelector('#paneltitle').textContent;if(name==='Lịch sử')rows(state.history,'history');else if(name==='Dấu trang')rows(state.bookmarks,'bookmarks');else if(name==='Tải xuống')rows(state.downloads,'downloads');else rows(['Bản Preview cho macOS. Google DNS và Sync chưa được tích hợp trong adapter macOS này. Bộ lọc WebKit có giới hạn so với bản Windows, gồm scriptlet và quảng cáo YouTube.'],'about')}
};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(findbar.getAttribute('aria-hidden')==='false'){event.preventDefault();send({action:'closeFind'})}else if(panel.getAttribute('aria-hidden')==='false'){event.preventDefault();send({action:'closePanel'})}return}if(!event.metaKey)return;const key=event.key.toLowerCase();if(key==='l'){event.preventDefault();address.focus();address.select()}else if(key==='t'){event.preventDefault();send({action:'newTab'})}else if(key==='r'){event.preventDefault();send({action:'reload'})}else if(key==='f'){event.preventDefault();send({action:'find'})}else if(key==='d'){event.preventDefault();send({action:'toggleBookmark'})}else if(key==='h'){event.preventDefault();openPanel('history')}else if(key==='j'){event.preventDefault();openPanel('downloads')}else if(key==='g'){event.preventDefault();send({action:event.shiftKey?'findPrevious':'findNext'})}});
send({action:'ready'});
</script></body></html>
